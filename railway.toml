# Amphis Railway config — NOT claimed LIVE VERIFIED.
# One GitHub repo → two Railway services (web + worker). See docs/DEPLOYMENT.md.

[build]
builder = "NIXPACKS"
buildCommand = "bun install --frozen-lockfile && bun run build"
watchPatterns = ["src/**", "scripts/**", "package.json", "drizzle/**"]

[deploy]
# Default service = web. Create a second Railway service from the same repo
# and override its start command to `bun run worker` (no public domain).
startCommand = "bun run preview --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
